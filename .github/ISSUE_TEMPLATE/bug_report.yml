name: Bug 报告
description: 报告可复现的问题或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有相同 Issue。若可复现，请尽量填写完整信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简洁地说明发生了什么
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现
      placeholder: |
        1. 执行 …
        2. 观察 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望的正确结果是什么
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: OS、运行时版本、相关配置等
      placeholder: |
        - OS:
        - 版本:
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 如有报错、堆栈或截图，请粘贴或附上链接
      render: shell
