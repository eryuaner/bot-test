name: 功能建议
description: 提出新功能或改进现有能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请先说明使用场景，便于评估优先级与实现方式。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 当前痛点或缺失的能力（例如「我经常在 … 时遇到 …」）
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你设想的功能或行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现该功能
          required: false
